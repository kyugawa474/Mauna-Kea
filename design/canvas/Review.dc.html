<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunday review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E5E4E0; color: #111111; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 56px 20px 0 20px; display: flex; flex-direction: column; gap: 32px; flex: 1 1 auto">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #66655F">Week of Oct 12</span>
      <h1 style="margin: 0; font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 0.9">Progress</h1>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px; border-top: 1px solid #111111; padding-top: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span><span style="font-size: 64px; font-weight: 200; letter-spacing: -0.04em; line-height: 0.85">2,467</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #66655F"> kJ</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #66655F">Recovery week · target 2,178</span>
      </div>
      <span style="width: 64px; height: 64px; border-radius: 50%; background: #FF4F1A; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 13px; display: grid; place-items: center">113%</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px" role="img" aria-label="Weekly kilojoules versus target, last 8 weeks">
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase"><span>Last 8 weeks</span><span style="color: #66655F">kJ vs target</span></div>
      <div style="height: 160px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; border-bottom: 1px solid #111111">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
          <div style="position: relative; height: 160px">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{b.h}}; background: {{b.color}}"></div>
            <div style="position: absolute; left: -3px; right: -3px; bottom: {{b.t}}; height: 1.5px; background: #111111"></div>
          </div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #66655F; text-align: center">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="8"><span>{{b.label}}</span></sc-for>
      </div>
    </div>

    <div style="background: #111111; color: #F1F0ED; padding: 18px 16px; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #FF4F1A">Next week</span>
        <span style="font-size: 15px; font-weight: 500">Build 3 · key Tue · long climb Sat</span>
      </span>
      <span style="font-size: 24px; font-weight: 300; letter-spacing: -0.02em">3,394<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #B9B7B1"> kJ</span></span>
    </div>
  </div>

  <nav aria-label="Main" style="height: 84px; box-sizing: border-box; border-top: 1px solid #111111; background: #E5E4E0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; padding-top: 10px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #66655F; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#66655F" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16"></rect></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase">Today</span>
    </a>
    <a href="Capture.dc.html" aria-label="Log food" style="display: flex; justify-content: center; text-decoration: none; margin-top: -26px">
      <span style="width: 58px; height: 58px; border-radius: 50%; background: #FF4F1A; display: grid; place-items: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg>
      </span>
    </a>
    <a href="Train.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #66655F; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#66655F" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="8" r="2"></circle><circle cx="12" cy="8" r="2"></circle><circle cx="18" cy="8" r="2"></circle><circle cx="6" cy="16" r="2"></circle><circle cx="12" cy="16" r="2"></circle><circle cx="18" cy="16" r="2"></circle></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase">Train</span>
    </a>
    <a href="Review.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #111111; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#111111" aria-hidden="true"><rect x="3" y="19.25" width="18" height="1.5"></rect><rect x="5" y="12" width="3" height="8"></rect><rect x="10.5" y="8" width="3" height="12"></rect><rect x="16" y="4" width="3" height="16"></rect></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase">Progress</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Weekly kJ (actual, target), Aug 24 → Oct 12 2026, from Strava power data
    var weeks = [
      ['8/24', 2112, 2805], ['8/31', 2878, 3300], ['9/7', 3973, 3795], ['9/14', 2587, 1980],
      ['9/21', 3030, 3086], ['9/28', 4307, 3630], ['10/5', 4068, 4174], ['10/12', 2467, 2178]
    ];
    var max = 4600, H = 160;
    var bars = weeks.map(function (w, i) {
      return { label: w[0], h: Math.round(w[1] / max * H) + 'px', t: Math.round(w[2] / max * H) + 'px',
        color: i === weeks.length - 1 ? '#FF4F1A' : '#111111' };
    });
    return { bars: bars };
  }
}
</script>
</body>
</html>
